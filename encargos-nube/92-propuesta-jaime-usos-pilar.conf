# PROPUESTA del encargo 92, SIN INSTALAR: que Jaime pueda leer (sólo leer) el contador de Pilar para /usos.
# Iría como /etc/systemd/system/botv3@jaime.service.d/30-usos-pilar.conf, después de revisarlo.
#
# Hoy Jaime tiene /opt/nodo/datos/botv3-pilar en InaccessiblePaths (10-perfil.conf). Esto NO lo saca: monta
# aparte, de sólo lectura, la subcarpeta `usos/` de Pilar, que no trae texto de mensajes (bot, función,
# canal, resultado y catalogo.json; 0644 en una carpeta 0755). Lo demás del estado de Pilar sigue oculto.
#
# A verificar en la Pi antes de instalar: que el bind de una subcarpeta de una ruta en InaccessiblePaths
# quede visible (systemd aplica los BindReadOnlyPaths después de ocultar; probar con
# `systemd-run -p InaccessiblePaths=... -p BindReadOnlyPaths=... ls /run/usos-pilar`). Si no funciona, Jaime
# muestra «Pilar: sin dato» y bots-info (root) igual entrega los dos a Cockpit.
[Service]
BindReadOnlyPaths=-/opt/nodo/datos/botv3-pilar/usos:/run/usos-pilar
Environment=BOTV3_USOS_OTROS=pilar=/run/usos-pilar
