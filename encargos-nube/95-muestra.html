<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>95 · muestra del tooltip de colas</title><style>/*
 * Paleta clara y oscura de las páginas propias de Cockpit (encargo 18, documento 26).
 * ÚNICA fuente: antes estaba copiada en sistema.css, nodo.css, luces.css, noticias.css y
 * bots/comun.css, con estos mismos valores. Ninguna página vuelve a definir estos
 * nombres (hay una prueba: pi/test_cockpit_paginas.py). Lo que es de una sola página
 * (la tira de LEDs, la paleta de los gráficos de noticias, el fondo de la terminal de
 * 👾) sigue en su hoja, con otros nombres.
 * El tema lo elige ../comun/tema.js, que pone data-theme en <html>.
 */
:root {
    --fondo: #f5f5f4;
    --tarjeta: #ffffff;
    --borde: #e2e2df;
    --texto: #1c1c1a;
    --tenue: #6b6b66;
    --acento: #2f6fdb;
    --acento-texto: #ffffff;
    --ok: #2e9b5a;
    --ok-fondo: #e6f4ec;
    --mal: #c93b3b;
    --mal-fondo: #fbe9e9;
    --ojo: #a86a00;
    --ojo-fondo: #fdf3df;
    --chip: #efefec;
    --terminal: #1b1b1a;
    --terminal-texto: #e8e6df;
}
:root[data-theme="dark"] {
    --fondo: #151514;
    --tarjeta: #1f1f1e;
    --borde: #33332f;
    --texto: #ecebe6;
    --tenue: #9d9c95;
    --acento: #5b8ff0;
    --acento-texto: #0d0d0c;
    --ok: #4cc27c;
    --ok-fondo: #173123;
    --mal: #ec6a6a;
    --mal-fondo: #3a1c1c;
    --ojo: #e5a93a;
    --ojo-fondo: #3a2c12;
    --chip: #2a2a28;
    --terminal: #0d0d0c;
    --terminal-texto: #e8e6df;
}

/*
 * Base de página de las seis herramientas propias de Cockpit (encargo 18, documento 26):
 * cuerpo, `main` con UN ancho máximo, barra compartida, cabecera, pestañas, tarjetas,
 * botones, avisos, chips, insignias, barras de uso, punto de estado, tablas, campos y el
 * diálogo de propuestas. Los colores vienen de tokens.css, que se carga antes.
 *
 * Cada página carga después su propia hoja, que sólo trae lo suyo y, cuando hace falta,
 * un ajuste sobre algo de acá (va marcado como tal en esa hoja).
 */
:root { --ancho-pagina: 1100px; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
    background: var(--fondo);
    color: var(--texto);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main {
    max-width: var(--ancho-pagina);
    margin: 0 auto;
    padding: 20px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 0 0 8px; }
h3 { font-size: 14px; margin: 12px 0 6px; color: var(--tenue); font-weight: 600; }
p { margin: 0 0 8px; }
a { color: var(--acento); }
code { font: 13px ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
       background: var(--chip); padding: 1px 5px; border-radius: 4px; }
.sub, .tenue { color: var(--tenue); font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; }

/* --- Barra compartida (la arma ../comun/barra.js en <nav id="barra">). Envuelve: en el
   teléfono baja de línea, no corre la página hacia el lado. --- */
.barra-nodo {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 6px 12px; padding-bottom: 10px; border-bottom: 1px solid var(--borde);
}
.barra-enlaces { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; min-width: 0; }
.barra-nodo .barra-enlace {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px;
    background: transparent; color: var(--texto); border-color: transparent; font-weight: 500;
}
.barra-nodo .barra-enlace.actual { background: var(--chip); border-color: var(--borde); font-weight: 600; }
.barra-punto { color: var(--tenue); padding: 0 2px; }
.barra-contador {
    background: var(--ojo-fondo); color: var(--ojo); border-radius: 999px;
    padding: 0 7px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.barra-contador[hidden] { display: none; }
.barra-lado { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-left: auto; }

/* --- Cabecera estándar: título y subtítulo corto. «leído hace X» y Actualizar van en la barra. --- */
.cabeza { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cabeza .sub { margin: 0; }

/* --- Pestañas --- */
.pestanas { display: flex; gap: 6px; flex-wrap: wrap; }
.pestanas button { background: transparent; color: var(--texto); border-color: var(--borde); font-weight: 500; }
.pestanas button.activa { background: var(--acento); color: var(--acento-texto); border-color: transparent; font-weight: 600; }
section[data-panel] { display: flex; flex-direction: column; gap: 12px; }
section[data-panel][hidden] { display: none; }

/* --- Botones --- */
button {
    font: inherit;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 7px 13px;
    cursor: pointer;
    background: var(--acento);
    color: var(--acento-texto);
    font-weight: 600;
}
button.secundario, button.mini {
    background: transparent;
    color: var(--texto);
    border-color: var(--borde);
    font-weight: 500;
}
button.mini { padding: 3px 9px; font-size: 13px; }
button:disabled { opacity: .5; cursor: default; }

/* --- Tarjetas y rejilla --- */
.tarjeta {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 14px 16px;
}
.rejilla {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 14px;
}

/* --- Avisos --- */
.aviso { border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.aviso.rojo { background: var(--mal-fondo); color: var(--mal); }
.aviso.ojo { background: var(--ojo-fondo); color: var(--ojo); }
.aviso.ok { background: var(--ok-fondo); color: var(--ok); }
.aviso.neutro { background: var(--chip); color: var(--tenue); }
.aviso ul { margin: 6px 0 0; padding-left: 18px; }

/* --- Chips e insignias --- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--borde); border-radius: 999px;
    padding: 4px 6px 4px 12px; font-size: 14px;
}
.chip.activa { background: var(--ok-fondo); border-color: transparent; }
/* Chip de dato (sin botón adentro): relleno parejo. Con .ojo o .mal avisa. */
.chip.dato { padding: 3px 10px; font-size: 13px; }
.chip.ojo { background: var(--ojo-fondo); color: var(--ojo); border-color: transparent; }
.chip.mal { background: var(--mal-fondo); color: var(--mal); border-color: transparent; }

.insignia {
    margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--ojo);
    background: var(--ojo-fondo); border-radius: 999px; padding: 2px 8px;
}

/* --- Barra de uso: los anchos llegan por data-ancho y CSSOM (el CSP bloquea style=). --- */
.barra-ciclo { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--chip); }
.barra-ciclo .usado { background: var(--ok); }
.barra-ciclo .ocioso { background: var(--chip); }
.barra-ciclo.justo .usado { background: var(--ojo); }
.barra-ciclo.lleno .usado { background: var(--mal); }

/* --- Punto de estado: verde por defecto; ámbar, rojo o gris con su clase. --- */
.punto { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); margin-right: 7px; }
.punto.ojo { background: var(--ojo); }
.punto.mal { background: var(--mal); }
.punto.gris { background: var(--tenue); }

.estado { font-weight: 600; white-space: nowrap; }
.estado.ok { color: var(--ok); }
.estado.mal { color: var(--mal); }
.estado.tenue { color: var(--tenue); font-weight: 500; }

/* --- Tablas y listas «dato → valor» --- */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--borde); vertical-align: top; }
th { color: var(--tenue); font-weight: 600; font-size: 12.5px; }
td.num { font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

.dato { display: grid; grid-template-columns: 150px 1fr; gap: 4px 10px; font-size: 14px; }
.dato dt { color: var(--tenue); }
.dato dd { margin: 0; word-break: break-word; }

details summary { cursor: pointer; }

/* --- Campos --- */
input[type=text], select, input.numero {
    font: inherit; border-radius: 7px;
    border: 1px solid var(--borde); background: var(--fondo); color: var(--texto);
}
input[type=text] { padding: 6px 9px; }
select { padding: 5px 8px; }
input.numero { width: 80px; padding: 4px 8px; }
.controles-voz { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
.controles-voz input[type=text] { flex: 1; min-width: 200px; }
.controles-voz.separado { margin-top: 8px; }

/* --- Diálogo de propuestas (lo arma ../comun/comun.js con id="dialogo") --- */
#dialogo {
    border: 1px solid var(--borde); border-radius: 12px; padding: 18px;
    background: var(--tarjeta); color: var(--texto); max-width: 520px; width: calc(100% - 32px);
}
#dialogo::backdrop { background: rgba(0, 0, 0, .45); }
#dialogo label { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--tenue); margin-top: 10px; }
.fila-botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.antes-despues { font-size: 14px; }
.antes-despues div { margin: 4px 0; }

.encargo-resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.encargo-fases { display: grid; gap: 8px; }
.encargo-fase { display: grid; grid-template-columns: 105px 1fr auto; gap: 8px; align-items: center; }
.encargo-barra { height: 18px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.encargo-barra > i { display: block; height: 100%; width: var(--ancho); margin-left: var(--inicio); background: var(--acento); }
.encargo-barra > .pronostico { position: absolute; opacity: .35; background: var(--tenue); }.encargo-barra { position: relative; }.encargo-barra > .cuenta-claude_cami, .encargo-barra > .cuenta-claude_diego { position: relative; }
.cuenta-claude_cami { background: var(--ok) !important; }.cuenta-claude_diego { background: var(--ojo) !important; }
.encargo-filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }.encargo-bitacora { white-space: pre-wrap; max-height: 62vh; overflow: auto; }.encargo-total { font-size: 13px; }
@media (max-width: 560px) { .encargo-fase { grid-template-columns: 80px 1fr; }.encargo-fase > :last-child { grid-column: 2; } }
/* Encargo 22, parte B: barra de progreso de las colas. Anchos y marcas van por CSSOM (--fill, --pos, --ancho). */
.cola-barra { position: relative; height: 16px; background: var(--chip); border-radius: 999px; overflow: visible; margin: 10px 0 6px; }
.cola-barra::before { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--fill, 0%); background: var(--acento); border-radius: 999px; }
.cola-barra.ok::before { background: var(--ok); }
.cola-barra.mal::before { background: var(--mal); }
.cola-barra > .marca { position: absolute; top: -3px; bottom: -3px; left: var(--pos, 0%); width: 2px; background: var(--tenue); }
.cola-barra > .marca.esperada { background: var(--texto); }
.cola-seg-caja { position: relative; }
.cola-seg { display: block; position: absolute; inset: 0 auto 0 0; width: var(--ancho, 0%); background: var(--acento); }
.cola-seg.mal { background: var(--mal); }
.cola-seg.pronostico { background: var(--tenue); opacity: .35; }
.cola-tarjeta { margin-bottom: 12px; }
/* Encargo 23a: «⚙️ Reparto y modelos». */
.config-ancho { overflow-x: auto; }
.config-tabla select { max-width: 100%; }
.config-par { display: flex; flex-wrap: wrap; gap: 6px; }
.config-cambiado { background: var(--ojo-fondo); }
.config-roto td { background: var(--mal-fondo); }
.config-simulacion { max-height: 48vh; margin-top: 10px; }
.config-mal { color: var(--mal); }
/* Encargo 23b: «🔔 Avisos». */
.avisos-tabla td { vertical-align: top; }
.avisos-tabla td:first-child { white-space: nowrap; }
.avisos-grupo th { text-align: left; background: var(--chip); }
.aviso-texto { white-space: pre-wrap; overflow-wrap: anywhere; }
.aviso-linea { display: block; margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.aviso-nota { color: var(--ojo); }
.avisos-pendientes { display: grid; gap: 12px; padding-left: 18px; }
/* Encargo 24: la espera de cuota y el aviso previo. */
.aviso-copiable { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; margin-top: 6px; }
.aviso-copiable .aviso-linea { margin-top: 0; flex: 1 1 260px; }
.aviso-previo { margin-top: 6px; }
.ordenable { cursor: pointer; user-select: none; white-space: nowrap; }
.ordenable:hover, .ordenable:focus-visible { color: var(--texto, inherit); }
/* Encargo 34: resumen de cola y etapa (una línea, con elipsis; el texto completo va en title). */
.resumen { margin: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uso-medida { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
/* Barra de uso: el largo va por CSSOM (--peso). Color = modelo: .uso-mN es el N-ésimo modelo de [niveles.*] de
   modelos.toml. Intensidad = esfuerzo, del más claro (low) al más oscuro (xhigh) dentro del mismo tono. */
.uso-m1 { --tono: #2a78d6; }.uso-m2 { --tono: #eb6834; }.uso-m3 { --tono: #1baf7a; }.uso-m4 { --tono: #eda100; }
.uso-m5 { --tono: #e87ba4; }.uso-m6 { --tono: #008300; }.uso-m7 { --tono: #4a3aa7; }.uso-m8 { --tono: #e34948; }
.uso-gris { --tono: #7d7d77; }
:root[data-theme="dark"] .uso-m1 { --tono: #3987e5; }:root[data-theme="dark"] .uso-m2 { --tono: #d95926; }
:root[data-theme="dark"] .uso-m3 { --tono: #199e70; }:root[data-theme="dark"] .uso-m4 { --tono: #c98500; }
:root[data-theme="dark"] .uso-m5 { --tono: #d55181; }:root[data-theme="dark"] .uso-m7 { --tono: #9085e9; }
:root[data-theme="dark"] .uso-m8 { --tono: #e66767; }:root[data-theme="dark"] .uso-gris { --tono: #8f8e87; }
.uso-e-low { --relleno: color-mix(in oklab, var(--tono) 38%, white); }
.uso-e-medium, .uso-e-vacio { --relleno: color-mix(in oklab, var(--tono) 68%, white); }
.uso-e-high { --relleno: var(--tono); }
.uso-e-xhigh { --relleno: color-mix(in oklab, var(--tono) 58%, black); }
.uso-barra { display: flex; gap: 2px; height: 18px; margin-top: 10px; }
.uso-tramo, .uso-muestra { background-color: var(--relleno, var(--tono)); border-radius: 3px; }
.uso-tramo { flex: var(--peso, 1) 1 0; min-width: 10px; }
.uso-e-vacio { border: 2px dotted var(--texto); }
.uso-sin-medida { flex: 0 0 14px; background-image: repeating-linear-gradient(45deg, transparent 0 3px, var(--tarjeta) 3px 5px); }
.uso-leyenda { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 6px; font-size: 12.5px; }
.uso-clave { display: inline-flex; align-items: center; gap: 5px; }
.uso-muestra { display: inline-block; flex: 0 0 14px; width: 14px; height: 12px; }
/* Encargo 46b: «Carga vs. capacidad». En el celular la matriz se desplaza hacia el lado con la columna de cuentas fija.
   El color de cada cola (.cola-c1 a .cola-c4, los de la maqueta del 45) es el mismo de los tramos de 💳 Cuentas. */
.cola-c1 { --c: #2f6fdb; }.cola-c2 { --c: #8a4fd8; }.cola-c3 { --c: #138a8a; }.cola-c4 { --c: #c2417d; }
:root[data-theme="dark"] .cola-c1 { --c: #5b8ff0; }:root[data-theme="dark"] .cola-c2 { --c: #a77cf0; }
:root[data-theme="dark"] .cola-c3 { --c: #3cb8b0; }:root[data-theme="dark"] .cola-c4 { --c: #e06a9f; }
.carga-envoltura { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.carga-matriz { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 560px; font-size: 13.5px; }
.carga-matriz th, .carga-matriz td { border-bottom: 1px solid var(--borde); padding: 8px 10px; vertical-align: top; text-align: left; min-width: 150px; }
.carga-matriz thead th { font-weight: 600; border-bottom: 2px solid var(--borde); }
.carga-matriz th.fila { position: sticky; left: 0; z-index: 1; min-width: 120px; max-width: 150px; background: var(--tarjeta); box-shadow: 1px 0 0 var(--borde); }
.carga-matriz .col-cola { border-top: 4px solid var(--c); }
.carga-matriz td.vacia { color: var(--tenue); text-align: center; }
.carga-matriz .holgura { background: var(--chip); min-width: 170px; }
.carga-matriz .linea { display: block; }
.carga-matriz .grande { font-size: 15px; font-weight: 600; }
.carga-matriz .chip { margin-top: 3px; }
.carga-nota { display: block; font-size: 12px; font-weight: 400; color: var(--tenue); overflow-wrap: anywhere; }
.valor.ok { color: var(--ok); }.valor.ojo { color: var(--ojo); }.valor.mal { color: var(--mal); font-weight: 700; }
.carga-matriz th.proyectada, .carga-matriz td.proyectada { border: 2px dotted var(--tenue); }
.carga-matriz .linea.proyectada { margin-top: 4px; padding: 2px 4px; border: 2px dotted var(--tenue); border-radius: 4px; color: var(--texto); }
.carga-muestra { display: inline-block; width: 14px; height: 12px; margin-right: 6px; vertical-align: -1px; border-radius: 3px; }
.carga-muestra.proyectada { border: 2px dotted var(--tenue); }
.carga-leyenda { margin-top: 8px; }
.carga-ayuda { margin: 0 0 10px; font-size: 13.5px; }.carga-ayuda summary { cursor: pointer; color: var(--tenue); }
.carga-ayuda dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 8px 0 0; }
.carga-ayuda dt { font-weight: 600; }.carga-ayuda dd { margin: 0; }
.carga-fuera { margin-top: 16px; }.carga-fuera h3 { margin: 0 0 6px; font-size: 15px; }
.carga-fuera ul { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.carga-fuera li { padding-top: 8px; border-top: 1px solid var(--borde); }
.carga-casilla { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 13.5px; cursor: pointer; }
@media (max-width: 560px) { .carga-ayuda dl { grid-template-columns: 1fr; } }
/* Encargo 46c: los botones de cada cola (Reanudar, Pausar, Detener), su resultado y el timer en modo sólo lectura. */
.cola-acciones { display: grid; gap: 6px; margin-top: 8px; }
.cola-botones { display: flex; flex-wrap: wrap; gap: 8px; }
button.mini.peligro { color: var(--mal); border-color: var(--mal); }
.cola-timer { margin: 0; font-size: 13px; }
.accion-resultado { margin-bottom: 12px; }
/* Encargo 50a: el estado del despacho, arriba de «Ahora», y las tablas de «Precisión del pronóstico». */
.despacho { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 12px; }
.pasado-tabla { border-collapse: collapse; font-size: 13px; }
.pasado-tabla th, .pasado-tabla td { padding: 4px 10px; text-align: left; border-bottom: 1px solid var(--borde); white-space: nowrap; }
/* Encargo 84a: el marco de la consola (C · Híbrida). Barra de módulos arriba, riel de submódulos al costado y área de
   trabajo con scroll propio: el cuerpo no se desplaza. Ajuste sobre base.css: `.consola-trabajo` es el `main` de la
   página y ocupa todo el ancho que le deja el riel (la consola no se centra a 1100 px). Anchos: ≥ 1100 px riel de
   240 px; 720–1100 px riel de 64 px con íconos y módulos con sólo íconos; < 720 px el riel es un cajón (☰) y los
   módulos, un selector. El chip de cuentas se despliega salvo a ≥ 1600 px, donde caben las tres. */
.consola { height: 100vh; height: 100dvh; overflow: hidden; display: grid; grid-template-rows: 64px minmax(0, 1fr); }
.consola-barra { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 0 12px; background: var(--tarjeta); border-bottom: 1px solid var(--borde); position: relative; z-index: 20; }
.consola-barra button { background: transparent; color: var(--texto); border: 1px solid var(--borde); font-weight: 500; }
.consola-redondo { position: relative; flex: 0 0 auto; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border-radius: 50%; }
