# Drop-in del perfil `jaime` sobre la plantilla botv3@.service.
#
# La plantilla nace CERRADA: usuario propio `bot%i`, sin vaults y sin ver el
# estado de los otros perfiles. Un perfil que necesite mas se lo abre aca, de modo
# que el permiso siempre se pide explicitamente y nunca se hereda por olvido.
#
# ============================================================================
# POR QUE JAIME ES LA EXCEPCION Y NO CORRE COMO `botjaime`  (13-09-2026)
# ============================================================================
# Medido antes de migrar: en vault_personal hay 398 archivos a 644 y **43 a 600**
# (en 00-Inbox/2026-09, 20-Areas/21-Huerto y los adjuntos). Con un usuario Unix
# distinto de dcifu004, esos 43 dejan de existir para el bot — sin error, sin
# aviso: contesta "no encontre nada" y no hay forma de saber que mintio. Es el
# peor modo de falla para un bot de consultas.
#
# Son archivos VIEJOS —`captura-web` y `captura-telegram` ya escriben con
# UMask=0022— asi que un `chmod` de una vez los arreglaria. Aun asi la separacion
# no se hace, porque para Jaime no compra casi nada: el usuario `dcifu004` ES
# Diego, y lo que hay que contener —que el proceso expuesto a internet no escriba
# donde no debe— ya lo hacen ProtectSystem=strict, ProtectHome y un ReadWritePaths
# de un solo elemento. Para Camila el usuario propio era imprescindible por lo
# contrario: es OTRA persona, y ahi el limite es entre personas, no entre procesos.
#
# Si algun dia se quiere igualar, el orden es: arreglar los 43 archivos, confirmar
# que nada vuelve a crear a 600 (ojo con Syncthing, que no es captura-web), y
# recien entonces cambiar el usuario.

# Drive (19-09-2026). `Wants` y NO `Requires`: un mount caido no puede dejar al
# bot sin contestar la hora. El codigo ya trata el Drive ausente como modo
# degradado —avisa en el log y responde con el resto de las fuentes—, y esta
# linea es la misma decision escrita en systemd.
#
# `After` SI es imprescindible, y es la trampa que cuesta una tarde: con
# ProtectSystem=strict el namespace del servicio se arma AL ARRANCAR, asi que un
# mount FUSE creado despues no se propaga y el bot ve un DIRECTORIO VACIO, sin
# ningun error. El sintoma es identico a "el archivo no existe". Por eso ademas
# hay centinela en el codigo: el orden de arranque cubre el caso normal; el
# centinela cubre el mount que se cae DESPUES (token vencido, red, LUKS).
[Unit]
# 24-09-2026: solo `personal`; `cyd` en pausa (ver perfiles/jaime.toml).
Wants=rclone-drive@personal.service
After=rclone-drive@personal.service

[Service]
User=dcifu004
Group=captura

# Las listas de systemd se ACUMULAN entre plantilla y drop-in: hay que vaciarlas
# con una linea sin valor antes de volver a declararlas, o quedan las dos.
# Sin esto, el ReadWritePaths de la plantilla apunta a /opt/nodo/datos/botv3-jaime,
# que no existe, y ProtectSystem=strict arma el namespace ANTES de ejecutar: da
# 226/NAMESPACE y el servicio no arranca.
ReadWritePaths=
ReadWritePaths=/opt/nodo/datos/botv3

ReadOnlyPaths=
ReadOnlyPaths=/opt/nodo/datos/srv/vault_personal /opt/nodo/datos/srv/vault_trabajo /opt/nodo/datos/agentes /opt/nodo/datos/nodo-memoria
# Los Drives NO van en ReadOnlyPaths (corregido el 24-09-2026). Para aplicarlo,
# systemd —como root— tiene que entrar al mount, y un FUSE sin `allow_other` le
# niega el acceso a root: el servicio no arrancaria. Tampoco hace falta:
# ProtectSystem=strict ya deja todo en solo lectura, y el mount es `--read-only`.


# Se le abren los vaults y se le tapa el estado del perfil de Camila, que incluye
# su claude-config con la credencial de su cuenta.
InaccessiblePaths=
InaccessiblePaths=-/home -/run/docker.sock -/var/run/docker.sock -/opt/nodo/datos/secretos -/opt/nodo/datos/botv3-pilar
