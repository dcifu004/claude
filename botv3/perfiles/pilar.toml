# `claude` entra porque camila@example.com TIENE plan pagado (confirmado el
# 13-09-2026): sus preguntas no gastan la cuota de Diego. Es Claude como modelo
# bueno para lo complejo, NO como lector de archivos — corre sobre un directorio
# vacio y sin los vaults en su namespace.
# `codex` ENTRO el 10-10-2026 con las propuestas AMPLIA aprobadas desde 🤖: la ruta
# tecnica la contesta primero Claude (Cami) y, de respaldo, Codex, que corre con la
# cuenta de ChatGPT Plus de Diego (ver `cuentas.codex` abajo). Su `web` NO pasa por
# Codex: lo prohibe el muro 11 de recetas.py y contestan las dos cuentas Claude. El
# auditor de rutas (encargo 94) avisa si alguna linea del registro sale de esto.
# `plantas` llega en la Fase 2, cuando la ruta exista.
rutas = ["gpt", "web", "ha", "claude", "codex", "boleta"]

# Quien paga cada ruta de agente, en orden (29-09-2026, pagina 🤖 → 💳 Cuentas).
# Hoy todo va con la cuenta de Camila. Que `codex` no figure en `web` es lo que
# impide que su busqueda le gaste la suscripcion de ChatGPT Plus a Diego: el
# 13-09-2026 eso se deducia de `rutas`, fallo en produccion, y desde entonces se
# declara y no se infiere. Agregar aca `codex` o `claude_diego` se puede desde la
# pagina (decision de Diego del 29-09), y `aplicar-propuesta` lo marca AMPLIA
# porque cambia quien paga.
cuentas = { claude = ["claude_cami"], codex = ["claude_cami", "codex"], web = ["claude_cami"] }

