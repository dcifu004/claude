# NINGUN vault. Y esta lista vacia NO es lo que lo hace cumplir: es una
# declaracion, para que el bot no ofrezca lo que no puede dar y para componer el
# prompt sin nombrar rutas que no debe conocer. Lo que de verdad lo impide son el
# usuario Unix propio `botpilar` y los `InaccessiblePaths` de
# botv3@pilar.service. El `if` puede tener un bug; el namespace no.
