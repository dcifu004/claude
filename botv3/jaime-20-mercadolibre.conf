# Mercado Libre en el perfil `jaime` (encargo 40, 10-10-2026).
#
# Se instala como /etc/systemd/system/botv3@jaime.service.d/20-mercadolibre.conf. En el vault
# NO está dentro de botv3@jaime.service.d/, junto a 10-perfil.conf, porque nodo-desplegar no
# acepta una fuente con «@» en la ruta (RE_FUENTE) y no se podría desplegar por ahí.
#
# /vigilar y /dejar escriben la lista de vigilados, después de un ✅ del chat. Es lo único que
# se le abre al bot: su carpeta de datos. El token NO está ahí ni en ningún lugar que el bot
# vea: vive en secretos/mercadolibre/, que este perfil tiene en InaccessiblePaths, y el bot
# habla con ml-puente por /run/ml-puente.sock (grupo `captura`, el de este servicio).
#
# Con «-» el bot arranca aunque la carpeta no exista; en ese caso /vigilar avisa que no pudo
# guardar. Las listas de systemd se acumulan: esta línea se suma al ReadWritePaths del perfil.
[Service]
ReadWritePaths=-/opt/nodo/datos/mercadolibre
