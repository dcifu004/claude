# El canal compartido de la casa (20-09-2026).
#
# Este drop-in va sobre la PLANTILLA y no sobre un perfil: la lista de compras y
# la memoria de hogar son de la casa, así que todo perfil que exista las ve. Lo
# contrario —abrirlo perfil por perfil— haría que un perfil nuevo naciera con
# una memoria de hogar que no comparte con nadie, y eso no falla: simplemente no
# se entera de nada, en silencio.
#
# Es el ÚNICO lugar donde dos perfiles se escriben el mismo archivo. Los
# ReadWritePaths de estado siguen siendo uno por perfil y los InaccessiblePaths
# siguen tapando el directorio del otro, con su claude-config adentro.
[Service]
# SupplementaryGroups y no un cambio de Group=: el grupo primario de cada
# servicio sigue siendo el suyo, así que lo que escriba fuera de este directorio
# no se vuelve legible para el resto de la casa por accidente.
SupplementaryGroups=casa
ReadWritePaths=/opt/nodo/datos/casa
