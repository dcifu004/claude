<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raspberry Pi</title>
    <!-- tokens, base, tema, el() y la barra son del paquete `comun`: una sola fuente para las seis páginas. -->
    <link href="../comun/tokens.css" rel="stylesheet" />
    <link href="../comun/base.css" rel="stylesheet" />
    <link href="sistema.css" rel="stylesheet" />
    <script src="../base1/cockpit.js"></script>
    <script src="../comun/tema.js"></script>
</head>
<body>
    <main>
        <nav id="barra" data-pagina="sistema"></nav>

        <header class="cabeza">
            <div>
                <h1>🍇 Raspberry Pi</h1>
                <p class="sub" id="sub">Pi5Diego</p>
            </div>
        </header>

        <nav class="pestanas" id="pestanas">
            <button data-p="inicio" class="activa">🏠 Inicio</button>
            <button data-p="estado">📊 Estado</button>
            <button data-p="servicios">🔁 Servicios</button>
            <button data-p="respaldo">💾 Respaldo</button>
            <button data-p="programados">⏰ Programados</button>
            <button data-p="turno">🔎 Turno</button>
        </nav>

        <div id="error" class="aviso rojo" hidden></div>

        <section data-panel="inicio"></section>
        <section data-panel="estado" hidden></section>
        <section data-panel="servicios" hidden></section>
        <section data-panel="respaldo" hidden></section>
        <section data-panel="programados" hidden></section>
        <section data-panel="turno" hidden></section>
    </main>
    <script src="../comun/dom.js"></script>
    <script src="../comun/barra.js"></script>
    <script src="inicio.js"></script>
    <script src="programados.js"></script>
    <script src="sistema.js"></script>
</body>
</html>
